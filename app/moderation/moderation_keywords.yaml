# Слой 1 модерации (блок 4.4, app/moderation/keywords.py): регулярные выражения по категориям.
#
# Самый дешёвый слой: проверяет вопрос пользователя до вызова модели и ответ модели — по мере
# генерации и целиком. Отсекает грубые случаи; тонкие ловит слой 2 — OpenAI Moderation
# (MODERATION__OPENAI_ENABLED=true).
#
# Перед проверкой текст нормализуется: NFKC, без невидимых символов, нижний регистр, «ё» -> «е»,
# пробелы и переводы строк схлопнуты в один пробел. Поэтому шаблоны — в нижнем регистре, с «е».
# Шаблон — регулярное выражение Python; \b — граница слова. Кавычки — одинарные: в них
# обратная косая черта не экранируется.
#
# Бот техподдержки слышит много похожих, но безобидных фраз — каждый новый шаблон проверяйте
# на них (tests/app/moderation/test_moderation_layers.py, ALLOWED):
#   «как убить зависший процесс», «мой аккаунт взломали», «как добавить закладку»,
#   «как распознать фишинговое письмо», «удалить аккаунт навсегда».
# Своя копия файла — MODERATION__KEYWORDS_FILE=путь/к/файлу.yaml.

categories:
  violence:
    # Угрозы человеку, а не «убить процесс»: глагол с объектом-человеком.
    - '\b(убью|убьем|прикончу|зарежу|пристрелю|задушу)\s+(тебя|вас|его|ее|их|всех)\b'
    - '\b(тебя|вас|его|ее|их|всех)\s+(убью|убьем|прикончу|зарежу|пристрелю|задушу)\b'
    - '\b(убить|прикончить|зарезать|пристрелить)\s+(тебя|вас|его|ее|их|всех|человека|людей)\b'
    - '\b(i\s+will|i''ll|gonna)\s+kill\s+(you|him|her|them|everyone)\b'
  self_harm:
    - '\b(покончить|покончу)\s+с\s+собой\b'
    - '\bсуицид'
    - '\b(хочу|хочется|собираюсь)\s+(умереть|не\s+жить)\b'
    # «не хочу жить», «больше не хочу жить», «жить не хочется» — но не «не хочу жить без тёмной темы».
    - '\bне\s+(хочу|хочется)\s+(больше\s+)?жить\b(?!\s+без\b)'
    - '\bжить\s+(больше\s+)?не\s+(хочу|хочется)\b'
    - '\bнезачем\s+жить\b'
    - '\bkill\s+myself\b'
    - '\bsuicid'
  weapons:
    - '\b(сделать|изготовить|собрать|смастерить)\s+(бомбу|взрывчатку|взрывное\s+устройство|самодельн\w*\s+взрывн\w*)'
    - '\bhow\s+to\s+(make|build)\s+(a\s+)?(bomb|explosive)'
  drugs:
    - '\b(купить|заказать|где\s+взять|достать)\s+(наркотик|мефедрон|героин|кокаин|амфетамин|спайс)'
    - '\b(buy|order)\s+(cocaine|heroin|meth)\b'
  hacking:
    # Намерение взломать чужое, а не жалоба «меня взломали».
    - '\bвзломать\s+(чужой|чужую|чужие|чужого|чей-то|чью-то)\b'
    - '\b(как|помоги|помогите|научи)\s+взломать\b'
    - '\b(украсть|похитить|увести)\s+(чужой\s+|чужие\s+)?(пароль|пароли|аккаунт|данные\s+карты|деньги)'
    - '\bhack\s+(someone|somebody)''?s?\s+(account|password)'
