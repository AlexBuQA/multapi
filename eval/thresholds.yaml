# Пороги качества для eval/check_thresholds.py (блок 3.7).
#
# min — агрегат последнего прогона должен быть не меньше значения,
# max — не больше. Имена — ключи из "aggregates" файла eval/runs/<дата>.json.
# Нарушен хотя бы один порог — check_thresholds.py завершается с кодом 1: релизить нельзя.

min:
  correctness_avg: 4.0     # средняя правильность ответов по всем кейсам
  min_correctness: 2.0     # ни одного кейса с правильностью ниже 2

max:
  must_not_contain_violations: 0   # в ответах нет запрещённых слов (утечка промпта, PII, выдуманная цена)
  errors: 0                        # каждый кейс получил ответ сервиса и оценку судьи
