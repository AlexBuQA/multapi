# Стек сервиса: HTTP-сервис app + Redis для кеша (блок 3.5) + Phoenix для трейсов (блок 3.6)
# + Postgres для истории чатов (блок 4.1) + Telegram-бот bot (блок 4.4) + Qdrant (блок 5.2).
#
#   cp .env.example .env           # вписать LLM__OPENAI_API_KEY (для Ollama — любое значение),
#                                  # BOT_TOKEN, INTERNAL_TOKEN, ADMIN_TOKEN и QDRANT_API_KEY
#   docker compose up -d --build   # всё одной командой: postgres -> migrate -> app -> bot
#   docker compose ps
#   docker compose logs -f app bot
#
# Интерфейс Phoenix: http://127.0.0.1:6006 (проект diploma-fastapi).
#
# Блок 4.4: история чатов, оценки, очередь рассылок и инциденты модерации — в Postgres
# (CHAT_REPOSITORY=postgres задан здесь, .env его не меняет), данные — в томе pg-data и
# переживают docker compose down / up (их удаляет только down -v). Миграции применяет
# одноразовый сервис migrate (alembic upgrade head) до старта app.
# Для uvicorn на хосте и тестов достаточно одного Postgres: docker compose up -d postgres,
# он доступен на 127.0.0.1:5433.
#
# Модель (Ollama) работает на хосте, а не в контейнере: из контейнера она доступна
# по адресу host.docker.internal.
#
# Блок 5.2: векторная база Qdrant — сервис qdrant, данные в томе qdrant_storage (переживают
# docker compose down / up, удаляются только down -v). Дашборд: http://localhost:6333/dashboard
# (ключ — QDRANT_API_KEY из .env). Без QDRANT_API_KEY в .env docker compose не запустится:
# ключ задаётся и на учебном стенде — конфигурация переезжает на сервер как есть.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: llm-service:v1
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Внутри compose-сети Redis — это имя сервиса redis, а не localhost.
      REDIS_URL: redis://redis:6379/0
      # Блок 4.1: история чатов. Postgres — по имени сервиса. Блок 4.4: в compose — всегда
      # Postgres (CHAT_REPOSITORY=json из .env для uvicorn на хосте здесь не действует).
      CHAT_REPOSITORY: postgres
      DATABASE_URL: postgresql+asyncpg://multapi:${POSTGRES_PASSWORD:-multapi}@postgres:5432/multapi
      CHAT_STORAGE_DIR: /app/var/chats
      # Блок 4.3: уведомления — в HTTP-API бота по имени сервиса (нужен INTERNAL_TOKEN в .env).
      BOT_URL: http://bot:9000
      # localhost внутри контейнера — сам контейнер. По умолчанию — Ollama на хосте;
      # для облачного провайдера задайте DOCKER_LLM_BASE_URL в .env.
      LLM__BASE_URL: ${DOCKER_LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      # Куда отправлять трейсы: Phoenix по имени сервиса, OTLP по HTTP (/v1/traces
      # дописывает app/observability/tracing.py). Без этой переменной трейсинг выключен.
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:6006
      # Блок 5.2: Qdrant — по имени сервиса; QDRANT_API_KEY, QDRANT_COLLECTION и EMBEDDING_DIM —
      # из .env (env_file выше).
      QDRANT_URL: http://qdrant:6333
    extra_hosts:
      # Docker Desktop знает host.docker.internal сам; строка нужна для Docker на Linux.
      - "host.docker.internal:host-gateway"
    volumes:
      - chat_data:/app/var/chats
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        # Таблицы созданы до первого запроса: app стартует, только если миграция прошла.
        condition: service_completed_successfully
      phoenix:
        # Phoenix нужен только для трейсов: сервис отвечает и без него, а спаны,
        # которые не удалось отправить, экспортёр отбрасывает. Ждём лишь запуска.
        condition: service_started
      qdrant:
        # Блок 5.2: при старте app проверяет коллекцию (ensure_collection) — Qdrant уже отвечает.
        condition: service_healthy
    healthcheck:
      # Готовность: /ready отвечает 200, только когда доступен Redis.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
      start_interval: 2s     # во время start_period проверка чаще — healthy через секунды, а не через 15 с

  migrate:
    # Блок 4.4: alembic upgrade head — один раз при каждом docker compose up, затем
    # контейнер завершается (Exited (0) в docker compose ps — это норма). Образ — тот же,
    # что у app: миграции лежат в нём (COPY migrations/).
    image: llm-service:v1
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    environment:
      DATABASE_URL: postgresql+asyncpg://multapi:${POSTGRES_PASSWORD:-multapi}@postgres:5432/multapi
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true          # проверка образа (/ready на 8000) — для app, не для миграции

  bot:
    # Блок 4.4: Telegram-бот (python -m bot) из того же образа, что и сервис.
    image: llm-service:v1
    command: ["python", "-m", "bot"]
    restart: unless-stopped
    env_file:
      - .env                 # BOT_TOKEN, BOT_ADMIN_IDS, BOT_PROXY_URL, INTERNAL_TOKEN, ADMIN_TOKEN
    environment:
      # Сервис — по имени в сети compose, а не 127.0.0.1 (это был бы сам контейнер бота).
      BACKEND_URL: http://app:8000
      # HTTP-API для уведомлений слушает все интерфейсы контейнера, иначе app до него не
      # достучится. Портов наружу нет: API доступно только из сети compose.
      BOT_API_HOST: 0.0.0.0
      BOT_API_PORT: "9000"
    volumes:
      # Корневые сертификаты сети для BOT_EXTRA_CA_FILE=certs/windows-roots.pem: у контейнера
      # своё хранилище Linux, и сертификата, которым сеть подменяет HTTPS, в нём нет
      # (docs/bot.md, «Бот в Docker»). Нет папки certs/ — Docker создаст пустую; в git она не идёт.
      - ./certs:/app/certs:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      disable: true          # у бота нет /ready; упадёт — его перезапустит restart

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    # Портов наружу нет: к Redis ходит только app по внутренней сети compose.
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
      start_interval: 1s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: multapi
      POSTGRES_DB: multapi
      # Пароль для учебного стенда; для общего сервера — POSTGRES_PASSWORD в .env.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-multapi}
    ports:
      # Только на 127.0.0.1 и не 5432: uvicorn на хосте, alembic и тесты ходят сюда, а
      # 5432 часто занят своим Postgres. С других компьютеров база не видна.
      - "127.0.0.1:5433:5432"
    volumes:
      # Блок 4.4: том pg-data — данные переживают docker compose down / up и пересборку.
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "multapi", "-d", "multapi"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
      start_interval: 1s

  qdrant:
    # Блок 5.2: векторная база. Версия образа — в паре с пакетом qdrant-client 1.19 (pyproject.toml,
    # requirements.txt): клиент и сервер должны совпадать по мажорной версии и расходиться по
    # минорной не больше чем на 1.
    image: qdrant/qdrant:v1.19.1
    restart: unless-stopped
    ports:
      # Только на 127.0.0.1: дашборд и скрипты на этом компьютере; с других компьютеров не видно.
      - "127.0.0.1:6333:6333"    # REST API и дашборд /dashboard
      - "127.0.0.1:6334:6334"    # gRPC
    environment:
      # Ключ API: без него Qdrant пускает любого. Значение — только в .env.
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?задайте QDRANT_API_KEY в .env — python -c "import secrets; print(secrets.token_urlsafe(32))"}
      # Телеметрию (анонимную статистику использования) Qdrant по умолчанию отправляет разработчикам.
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      # Именованный том: коллекции переживают docker compose down / up и пересоздание контейнера.
      - qdrant_storage:/qdrant/storage
    healthcheck:
      # Проверка по TCP: порт 6333 принимает соединения. В образе нет curl и wget, а /dev/tcp —
      # встроенная возможность bash. /healthz отвечал бы и без ключа, но TCP-проверки достаточно.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
      start_interval: 1s

  phoenix:
    image: arizephoenix/phoenix:latest
    restart: unless-stopped
    ports:
      - "6006:6006"    # интерфейс и приём трейсов по OTLP/HTTP (/v1/traces)
      - "4317:4317"    # приём трейсов по OTLP/gRPC — для клиентов, которые шлют по gRPC
    environment:
      # Здесь Phoenix хранит базу SQLite с трейсами — на томе, чтобы трейсы
      # переживали docker compose down / up.
      PHOENIX_WORKING_DIR: /data
    volumes:
      # Тег latest — вариант образа, работающий от root, поэтому в новый том можно
      # писать. У тега latest-nonroot (uid 65532) каталог тома пришлось бы отдать
      # этому пользователю.
      - phoenix-data:/data
    healthcheck:
      # Готов принимать трейсы — /healthz отвечает 200. Образ distroless: shell и curl
      # нет, есть только Python, которым запущен сам Phoenix (/usr/bin/python3.13 —
      # колонка COMMAND в docker compose ps). Если новая версия образа сменит Python,
      # путь нужно поправить. Без healthcheck docker compose up --wait не ждёт Phoenix,
      # а он запускается дольше сервиса: первые трейсы уходили в никуда.
      test: ["CMD", "/usr/bin/python3.13", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6006/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Пока идёт start_period, неудачные проверки не считаются, а первая удачная сразу
      # даёт healthy — на быстрой машине это секунды. 5 минут — с запасом для WSL
      # с 1 ГБ памяти: там первый запуск Phoenix занял 5,5 минуты.
      start_period: 300s
      start_interval: 2s

volumes:
  redis_data: {}
  phoenix-data: {}
  pg-data: {}
  chat_data: {}
  qdrant_storage: {}
