# Alembic: Postgres schema migrations for the chat history (block 4.1).
#
#   alembic upgrade head                                 apply migrations
#   alembic revision --autogenerate -m "description"     new migration from the ORM models
#
# Database URL: DATABASE_URL from the environment or .env (same as the service), default
# postgresql+asyncpg://multapi:multapi@127.0.0.1:5433/multapi (postgres service from compose.yaml).
# No URL in this file: it would contain a password. Models: app/chat/repositories/pg_models.py.
#
# ASCII only: Alembic reads this file in the locale encoding (cp1251 on Russian Windows,
# ascii in a container without a locale), so non-ASCII comments break "alembic upgrade".

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
