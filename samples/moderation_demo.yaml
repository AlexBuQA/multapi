# Демо-словарь модерации (блок 4.4) — для ручной проверки замены ответа, не для работы.
#
# Блокирует слово «пароль». Вопрос «Не могу войти в личный кабинет, что делать?» этого слова не
# содержит и проходит, а ответ модели по руководству почти наверняка его содержит («Забыли
# пароль?») — и ответ заменяется отказом «Не могу показать ответ — он мог нарушить правила.».
#
#   MODERATION__KEYWORDS_FILE=samples/moderation_demo.yaml   # в .env, после проверки — убрать
categories:
  demo:
    - '\bпарол'
