# Ручная вычитка golden dataset (блок 5.6): решение по каждой строке tests/eval/golden_dataset_raw.csv.
# Сборка: python scripts/build_golden.py → tests/eval/golden_dataset.json (сырой CSV не меняется).
#
#   keep: true                       — пара входит в golden;
#   keep: false + reason             — выброшена, причина обязательна;
#   user_input / reference           — исправленный вопрос или эталон (в golden_dataset.json — поле edited);
#   note                             — что было не так у модели.
#
# Каждая пара сверена с документом корпуса из reference_sources. Правила вычитки:
# - выбрасываются вопросы о метаданных статьи (номер KB, раздел справки, дата обновления) — пользователь так
#   не спрашивает; дубли (тот же документ и тот же вопрос); нечитаемые и не по-русски, если смысл не спасти;
# - вопрос с опечатками, мусором или номером статьи переписывается так, как спросил бы пользователь;
# - эталон правится, если в нём ошибка (испорченное число, опечатка, перевод), выдумка или строка метаданных,
#   и дополняется, если не отвечает на вопрос полностью;
# - вопрос не должен совпадать со свободными вопросами scripts/trace_queries.py (FREE): те — трафик вне golden.
#
# Генерация 1 (raw_001–raw_040, qwen3:4b-instruct): 40 пар → оставлено 34 (поправлено 23), выброшено 6.
# Single-hop шёл по порядку файлов корпуса и покрыл только account, api и billing — остальные категории
# добраны генерацией 2 (raw_041–raw_052, --append по ещё не взятым документам): 12 пар → оставлено 11
# (поправлено 9), выброшена 1. Итого: 52 сырые пары → 45 в golden (поправлено 32), все 11 категорий корпуса.

