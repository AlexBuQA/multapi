# Зависимости Docker-образа (блок 3.5): то, что импортируют app.main и, с блока 4.4,
# Telegram-бот (python -m bot) — он запускается из того же образа отдельным сервисом compose.
# Образ собирается через uv по lock-файлу uv.lock (uv sync --frozen) — версии в нём
# закреплены, сборка воспроизводима. Локальная разработка всего проекта (CLI, бенчмарк,
# ассистент с инструментами) по-прежнему идёт через requirements.txt и pip.
#
# После изменения списка зависимостей обновите lock-файл: uv lock
[project]
name = "multapi-llm-service"
version = "5.3.0"
description = "HTTP-сервис ассистента техподдержки на FastAPI и Telegram-бот: чат, поток SSE, кеш в Redis, логи и трейсы, история чатов, модерация, эмбеддинги, векторный поиск, RAG"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142,<1.0",   # 0.142 — встроенная трассировка HTTP-запросов (блок 3.6)
    "uvicorn>=0.30,<1.0",
    "openai>=2.0,<3.0",
    "redis>=5.0.1,<9.0",
    "pydantic-settings>=2.2,<3.0",
    # блок 3.6: JSON-логи и трейсинг вызовов модели в Phoenix
    "structlog>=24.1,<27.0",
    "arize-phoenix-otel>=0.13,<1.0",
    "openinference-instrumentation-openai>=0.1.30,<1.0",
    "opentelemetry-sdk>=1.30,<2.0",
    # блок 4.1: история чатов — файлы JSONL или Postgres, миграции, подсчёт токенов
    "aiofiles>=24.1,<26.0",
    "sqlalchemy[asyncio]>=2.0.30,<3.0",
    "asyncpg>=0.29,<1.0",
    "alembic>=1.13,<2.0",
    "tiktoken>=0.7,<1.0",
    # блок 4.3: медиа в чатах — форма multipart, текст PDF и DOCX
    "python-multipart>=0.0.20,<1.0",
    "pypdf>=5.1,<7.0",
    "python-docx>=1.1,<2.0",
    # блок 4.4: словарь модерации в YAML; Telegram-бот в том же образе (сервис bot в compose)
    "pyyaml>=6.0,<7.0",
    "httpx>=0.26,<1.0",
    "truststore>=0.10,<1.0",
    "aiogram>=3.24,<4.0",      # 3.24+ — sendMessageDraft (блок 4.3)
    "aiohttp-socks>=0.10,<1.0",
    # блок 5.1: эмбеддинги (app/services/embeddings.py) — повторы запросов к модели
    "tenacity>=9.0,<10.0",
    # блок 5.2: векторная база Qdrant (app/services/vector_store.py). Минорная версия — в паре с
    # образом qdrant/qdrant в compose.yaml (расхождение не больше 1)
    "qdrant-client>=1.19,<2.0",
    # блок 5.3: RAG на LlamaIndex (app/services/rag.py, POST /rag/query). Версии точные: API
    # LlamaIndex меняется между минорными выпусками; проверенные версии — docs/rag.md
    "llama-index==0.14.25",                      # ядро + OpenAI LLM и эмбеддинги
    "llama-index-vector-stores-qdrant==0.10.3",  # QdrantVectorStore
    "llama-index-readers-file==0.7.0",           # PDF, DOCX и другие форматы в SimpleDirectoryReader
    "llama-index-llms-openai-like==0.8.0",       # OpenAI-совместимый API: Ollama, OpenRouter
    "docx2txt==0.9",                             # DocxReader из readers-file без него не работает
    # блок 5.5: PDF в ingestion (app/services/ingestion.py) — PyMuPDFReader, страница — документ
    "pymupdf==1.28.2",
    # блок 6.1: get_current_time агента — zoneinfo; на Windows своей базы часовых поясов нет
    "tzdata>=2024.1",
    # блок 6.3: агент на LangGraph (app/services/agent_graph.py) — StateGraph и create_agent. До блока 6.3
    # эти пакеты приходили только транзитивно с группой eval (ragas), теперь — явно и с границей мажорной версии
    "langgraph>=1.0,<2",
    "langchain>=1.0,<2",
    "langchain-core>=1.0,<2",
    "langchain-openai>=1.0,<2",
    # блок 6.4: персистентный агент (app/services/agent_persistent.py) — checkpointer SQLite для разработки и
    # Postgres для compose. Версии сверены с PyPI 19.10.2026: checkpoint-sqlite 3.1.2, checkpoint-postgres 3.2.0
    # (обе требуют langgraph-checkpoint 4.3). aiosqlite — явно: без него AsyncSqliteSaver не импортируется.
    # AsyncPostgresSaver работает на psycopg 3 (не psycopg2 и не asyncpg сервиса): binary — готовые wheel без libpq
    # в системе, pool — AsyncConnectionPool
    "langgraph-checkpoint-sqlite>=3.1,<4",
    "langgraph-checkpoint-postgres>=3.1,<4",
    "aiosqlite>=0.20,<1",
    "psycopg[binary,pool]>=3.2,<4",
]

[project.optional-dependencies]
# Блок 5.6: трейсинг LlamaIndex в Phoenix (app/observability/tracing.py) — retriever-, embedding- и
# LLM-спаны RAG. Ставится по требованию: uv sync --extra tracing или pip install -r
# requirements-tracing.txt. Без группы сервис работает: в Phoenix остаются спаны /chat (блок 3.6).
# Образ compose собирается с этой группой (аргумент сборки UV_EXTRAS в Dockerfile).
# Задание называет openinference-instrumentation-llama-index>=3,<4, но последняя 3.x (3.3.3) импортирует
# llama_index.core.base.agent, которого в llama-index-core 0.14 нет: сервис падал при старте
# (ModuleNotFoundError). Ветка 4.x поддерживает llama-index-core>=0.14.19.
tracing = [
    "openinference-instrumentation-llama-index>=4.5,<5",
    "opentelemetry-sdk>=1.30,<2.0",
    "opentelemetry-exporter-otlp>=1.30,<2.0",
]
# Блок 5.6: офлайн-оценка RAG (scripts/run_eval.py, generate_testset.py) — в проде не нужна,
# в образ не входит. uv sync --extra eval или pip install -r requirements-eval.txt.
# langchain-community<0.4: RAGAS 0.4 тянет его в ядре, а свежие 0.4.x ломают импорт
# langchain_community.chat_models.vertexai — без пина import ragas падает.
eval = [
    "ragas>=0.4,<0.5",
    "langchain-community<0.4",
    "anthropic>=0.40",
    "pandas>=2",
    "arize-phoenix>=5",
    # TestsetGenerator: связи графа знаний по общим сущностям (OverlapScoreBuilder) — без него
    # generate_testset.py падает на ImportError, в зависимостях ragas пакета нет
    "rapidfuzz>=3,<4",
    # Локальный сервер Phoenix (phoenix serve) из arize-phoenix 20.3 с graphql-core 3.3 (сентябрь 2026) не
    # открывает трейс с аннотацией: «Int cannot represent non-integer value: <int64 instance>» — счётчики
    # аннотаций приходят из pandas как numpy.int64, а graphql-core 3.3 их больше не приводит к int.
    "graphql-core>=3.2,<3.3",
]

[tool.uv]
# Сервис — не устанавливаемый пакет: uv ставит только зависимости, код копируется в образ.
package = false

[tool.pytest.ini_options]
# Блок 3.7. Быстрые тесты — на каждое сохранение: pytest tests/unit/ -m "not llm".
# Тесты с настоящей моделью помечены llm и по умолчанию не запускаются: pytest -m llm.
testpaths = ["tests"]
addopts = "-m 'not llm'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "llm: обращается к настоящей модели (Ollama или API) — медленно, нужна запущенная модель",
]
